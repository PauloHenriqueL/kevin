# Blueprint de deploy no Render — banco no Neon (Postgres serverless).
#
# O banco NÃO é do Render: usamos o Neon (plano free generoso, sem expirar em
# 90 dias como o do Render). A conexão vem pela env var DATABASE_URL, que você
# cola do painel do Neon (marcada `sync: false` = preenchida manualmente).
#
# Chat em modo síncrono nesta primeira subida — sem Redis/Celery.
#
# Para subir: no Render, "New +" → "Blueprint" → aponte para este repositório.
# Depois preencha no painel as vars marcadas `sync: false` (ver docs/demandas.md,
# "Deploy — passo a passo").

services:
  - type: web
    name: kevin
    runtime: docker
    # starter, não free, por dois motivos: o free hiberna após 15 min (~30s
    # para acordar, ruim na frente do cliente) e o Render NÃO aceita
    # preDeployCommand em serviço free — o migrate abaixo seria recusado.
    plan: starter
    # Mesma região do projeto no Neon (AWS US East 2 / Ohio). O padrão do Render
    # é oregon (US West) — com o banco em Ohio, toda query atravessaria o país.
    # A região NÃO pode ser alterada depois que o serviço é criado.
    region: ohio
    dockerfilePath: ./Dockerfile
    # Migra o banco antes de cada deploy — nunca sobe código novo com schema velho.
    preDeployCommand: python manage.py migrate --noinput
    envVars:
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true   # o Render gera uma chave forte e a mantém
      # Cole aqui a Connection String do Neon (ver passo a passo). Precisa ter
      # ?sslmode=require no fim — o Neon exige SSL.
      - key: DATABASE_URL
        sync: false
      # O domínio real que o Render atribuiu: "kevin.onrender.com" já estava
      # tomado por outro serviço, então o nosso ganhou o sufixo. Errar isto
      # devolve 400 em toda página (ALLOWED_HOSTS) e 403 em todo POST
      # (CSRF_TRUSTED_ORIGINS), sem mensagem que explique.
      - key: ALLOWED_HOSTS
        value: kevin-qv84.onrender.com
      - key: CSRF_TRUSTED_ORIGINS
        value: https://kevin-qv84.onrender.com
      # Mídia do Kevin no bucket público do Neon (Demanda 19). Não é segredo:
      # o bucket é public_read, é o navegador do professor que baixa. Sem esta
      # var o template cai em static/, que em produção está vazio — o Kevin
      # aparece sem cenário, sem trilha e sem animação de entrada.
      - key: KEVIN_ASSETS_BASE_URL
        value: https://br-snowy-night-b5sa910i.storage.c-7.us-east-2.aws.neon.tech/kevin-assets
      # Chaves de IA/voz — opcionais; o chat cai em modo demo sem elas.
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
