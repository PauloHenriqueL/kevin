# Blueprint de deploy no Render (ver a seção "🚧 Deploy" do CLAUDE.md).
#
# Declara web + Postgres num arquivo versionado, em vez de cliques na interface.
# Chat roda em modo síncrono (?sync=1) — sem Redis/Celery nesta primeira subida;
# eles entram depois, quando o volume justificar (dois serviços a mais na conta).
#
# Para subir: no Render, "New +" → "Blueprint" → aponte para este repositório.
# As chaves de IA (opcionais) e o SECRET_KEY são preenchidos no painel.

databases:
  - name: kevin-db
    databaseName: bebelingue
    user: bebelingue
    plan: free   # trocar para 'basic' antes de uso real — o free expira em 90 dias

services:
  - type: web
    name: kevin
    runtime: docker
    plan: free   # o free hiberna após 15 min; serve para teste, não para demo
    dockerfilePath: ./Dockerfile
    # Migra o banco antes de cada deploy — nunca sobe código novo com schema velho.
    preDeployCommand: python manage.py migrate --noinput
    envVars:
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true   # o Render gera uma chave forte e a mantém
      - key: DATABASE_URL
        fromDatabase:
          name: kevin-db
          property: connectionString
      - key: ALLOWED_HOSTS
        value: kevin.onrender.com   # ajustar se o domínio final for outro
      - key: CSRF_TRUSTED_ORIGINS
        value: https://kevin.onrender.com
      # Chaves de IA/voz — opcionais; o chat cai em modo demo sem elas.
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
